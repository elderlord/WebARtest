name: Deploy to GitHub Pages

# 현재 개발 브랜치에 push되면 빌드 후 GitHub Pages로 배포한다.
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source를
#           "GitHub Actions"로 설정해야 이 워크플로가 배포할 수 있다.
on:
  push:
    branches: [claude/webar-panel-text-emphasis-jt4uwf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 (진행 중 배포는 취소하지 않고 큐잉)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
