<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- WebAR: 전체화면 카메라 뷰. 사용자 확대/축소 방지, 노치 대응 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>WebAR 패널 강조 · 0단계 계측 하네스</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- three.js 캔버스와 HUD가 여기에 마운트된다 -->
    <div id="app"></div>

    <!-- 부팅 진단: main.js가 실행되면 제거된다.
         이 문구가 계속 보이면 = HTML은 떴으나 스크립트가 실행 안 됨(자산 404/모듈 오류).
         완전 백색(이 문구조차 없음)이면 = HTML 자체가 안 뜸(URL/배포/캐시 문제). -->
    <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:14px/1.7 -apple-system,sans-serif;color:#444">
      로딩 중… 몇 초 뒤에도 이 문구만 보이면 스크립트/자산 로드 실패입니다.
    </div>

    <!-- 자가복구: 캐시/전파 지연으로 번들이 안 뜨면 1회 자동 새로고침(무한루프 가드). -->
    <script>
      setTimeout(function () {
        if (document.getElementById('boot') && !sessionStorage.getItem('_reloadOnce')) {
          sessionStorage.setItem('_reloadOnce', '1')
          location.reload()
        }
      }, 5000)
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
